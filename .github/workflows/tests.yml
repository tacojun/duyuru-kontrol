name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build
      - name: Check wheel and source distribution in clean environments
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(python -c 'import os, pathlib, tomllib; print(tomllib.loads((pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')
          for format in wheel sdist; do
            if [ "$format" = wheel ]; then
              artifact="$GITHUB_WORKSPACE/dist/duyuru_kontrol-$package_version-py3-none-any.whl"
            else
              artifact="$GITHUB_WORKSPACE/dist/duyuru_kontrol-$package_version.tar.gz"
            fi
            environment="$RUNNER_TEMP/duyuru-$format"
            python -m venv "$environment"
            "$environment/bin/python" -m pip install "$artifact"
            "$environment/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed.py" --expected-version "$package_version"
          done
