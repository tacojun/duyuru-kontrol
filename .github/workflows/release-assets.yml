name: Upload verified release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag with an empty draft release (for example v0.2.0)
        required: true
        type: string
      commit:
        description: Full commit SHA expected at the version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag, version and draft release
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          commit = os.environ['EXPECTED_COMMIT']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a vMAJOR.MINOR.PATCH tag')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Expected a full commit SHA')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != commit:
              raise SystemExit(f'Tag checkout mismatch: {actual}')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          if tag != 'v' + version:
              raise SystemExit('Tag and package version differ')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(f'Building {tag} from {actual}')
          PY
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/release-before.json"
          python - <<'PY'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-before.json').read_text())
          if not release['isDraft'] or release['assets']:
              raise SystemExit('Expected an existing empty draft; nothing will be overwritten')
          PY
      - run: python -m pip install build
      - run: python -m build
      - run: python -m unittest discover -s tests -v
      - name: Check installed wheel and source distribution
        working-directory: ${{ runner.temp }}
        env:
          PACKAGE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          for format in wheel sdist; do
            if [ "$format" = wheel ]; then
              artifact="$GITHUB_WORKSPACE/dist/duyuru_kontrol-$PACKAGE_VERSION-py3-none-any.whl"
            else
              artifact="$GITHUB_WORKSPACE/dist/duyuru_kontrol-$PACKAGE_VERSION.tar.gz"
            fi
            package_env="$RUNNER_TEMP/release-$format"
            python -m venv "$package_env"
            "$package_env/bin/python" -m pip install "$artifact"
            "$package_env/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed.py" --expected-version "$PACKAGE_VERSION"
          done
      - name: Upload checked files to the draft
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          wheel="duyuru_kontrol-$PACKAGE_VERSION-py3-none-any.whl"
          sdist="duyuru_kontrol-$PACKAGE_VERSION.tar.gz"
          sha256sum "$wheel" "$sdist" > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/release-upload.json"
          python - <<'PY'
          import json, os, pathlib
          release = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-upload.json').read_text())
          if not release['isDraft'] or release['assets']:
              raise SystemExit('Draft changed during verification; upload stopped')
          PY
          gh release upload "$RELEASE_TAG" "$wheel" "$sdist" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          cat SHA256SUMS
